name: Verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test-only shell and manual tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh groff
      - name: Report host tools
        run: |
          bash --version
          node --version
          python3 --version
          zsh --version
      - name: Verify without real accounts or package installation
        run: python3 -B tools/verify.py
      - name: Check whitespace
        run: git diff --check
